version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: orcamento_user
      POSTGRES_PASSWORD: sua_senha_segura_aqui
      POSTGRES_DB: orcamento_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      - DB_USER=orcamento_user
      - DB_PASSWORD=sua_senha_segura_aqui
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=orcamento_db
      - APP_ENV=production
      - DEBUG=False
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata: